# Cần repo secrets: DATABASE, ANTHROPIC_API_KEY, CLOUDINARY_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
name: Scheduled jobs
on:
  schedule:
    - cron: "0 19 * * *"  # 02:00 giờ Việt Nam: cào giá
    - cron: "0 23 * * *"  # 06:00 giờ Việt Nam: sinh bài viết
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [scrape, blog]

jobs:
  scrape:
    if: github.event.schedule == '0 19 * * *' || inputs.job == 'scrape'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE: ${{ secrets.DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r price_scraper/requirements.txt
      - run: python price_scraper/scrape_prices.py
  blog:
    if: github.event.schedule == '0 23 * * *' || inputs.job == 'blog'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE: ${{ secrets.DATABASE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r blog_automation/requirements.txt
      - run: python blog_automation/generate_blog.py
